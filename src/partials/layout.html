<!doctype html>
<html lang="en-IN" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  {{robots}}
  <meta name="theme-color" content="#FAF7F2">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nails by A">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
  {{head}}
</head>
<body class="{{bodyClass}}">
  {{icons}}
  <a class="skip-link" href="#main">Skip to main content</a>

  {{header}}

  <main id="main" tabindex="-1">
{{content}}
  </main>

  {{footer}}
  {{stickyCta}}

  <script src="assets/js/main.js" defer></script>
  {{scripts}}
</body>
</html>
